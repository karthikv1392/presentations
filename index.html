<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slide decks</title><link rel="stylesheet" href="style.css"></head>
<body><div class="wrap">
<h1>Slide decks</h1><p class="sub">Lecture slides. Open a deck, then use the arrow keys, or swipe on a phone.</p>
<div class="grid" id="grid"></div></div>
<script>
fetch('decks.json').then(r => r.json()).then(list => {
  document.getElementById('grid').innerHTML = list.map(d =>
    `<a class="card" href="deck.html?d=${encodeURIComponent(d.id)}"><img src="${d.cover}" alt="" loading="lazy"><div><b>${d.title}</b><span>${d.count} slides</span></div></a>`).join('')
}).catch(() => { document.getElementById('grid').textContent = 'Could not load decks.json' })
</script></body></html>
